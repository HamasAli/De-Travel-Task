<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Text Path -->
    <path id="topTextPath" d="M 65 250 A 185 185 0 0 1 435 250" fill="none" />
    <!-- Bottom Text Path -->
    <path id="bottomTextPath" d="M 435 250 A 185 185 0 0 1 65 250" fill="none" />

    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <clipPath id="innerCircleClip">
      <circle cx="250" cy="250" r="128" />
    </clipPath>
  </defs>

  <!-- Outer Deep Navy Circle -->
  <circle cx="250" cy="250" r="240" fill="#0b1224" stroke="#ffffff" stroke-width="8" />
  
  <!-- Outer Gold Decorative Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- Inner Gold Ring Border -->
  <circle cx="250" cy="250" r="132" fill="#17244e" stroke="url(#goldGradient)" stroke-width="4" />

  <!-- Top Text: NASIR STANDARD -->
  <text fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="31" font-weight="900" letter-spacing="6">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      NASIR STANDARD
    </textPath>
  </text>

  <!-- Bottom Text: TRAVEL CONSULTANCY -->
  <text fill="#f59e0b" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="4">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      TRAVEL CONSULTANCY
    </textPath>
  </text>

  <!-- Left Flanking Star -->
  <g transform="translate(68, 250) scale(0.9)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#f59e0b" />
  </g>

  <!-- Right Flanking Star -->
  <g transform="translate(432, 250) scale(0.9)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="#f59e0b" />
  </g>

  <!-- Inner Center Shield / Crest -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Center Radial Background -->
    <rect x="120" y="120" width="260" height="260" fill="url(#primaryGradient)" />

    <!-- Lat-Long Globe Grid Lines -->
    <circle cx="250" cy="250" r="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" />
    <ellipse cx="250" cy="250" rx="90" ry="40" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" />
    <ellipse cx="250" cy="250" rx="40" ry="90" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25" />
    <line x1="160" y1="250" x2="340" y2="250" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    <line x1="250" y1="160" x2="250" y2="340" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />

    <!-- Modern Stylized Jet Flight Arc -->
    <path d="M 170 300 C 190 220, 270 190, 315 190" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" opacity="0.85" />
    
    <!-- Airplane Icon -->
    <g transform="translate(315, 190) rotate(45) scale(1.1)">
      <path d="M0 -18 L4 -6 L18 0 L4 4 L3 14 L0 12 L-3 14 L-4 4 L-18 0 L-4 -6 Z" fill="#ffffff" />
      <circle cx="0" cy="-2" r="2" fill="#0f766e" />
    </g>

    <!-- Center Monogram "NST" -->
    <text x="250" y="278" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))">
      NST
    </text>
  </g>
</svg>
